<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-default>Auralytix · Autonomous Intelligence Platform</title>
    <meta name="theme-color" content="#04070d" />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #04070d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #94a3b8;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div style="position: absolute; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, transparent 70%); filter: blur(10px);"></div>
          <div style="position: relative; width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
        </div>
        <div style="font-size: 20px; font-weight: 700; color: #f8fafc; letter-spacing: -0.5px; margin-bottom: 4px;">Auralytix</div>
        <div style="font-size: 11px; color: #06b6d4; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 24px;">Autonomous Intelligence Platform</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #06b6d4; animation: pulse 1.5s infinite;"></div>
          <span style="font-size: 13px; color: #64748b;">Initializing neural orchestrator...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
