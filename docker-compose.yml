services:
  # 1. PostgreSQL Relational Database (Amazon RDS compatible / local standalone)
  postgres:
    image: postgres:16-alpine
    container_name: auralytix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auralytix_user
      POSTGRES_PASSWORD: auralytix_secure_password
      POSTGRES_DB: auralytix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralytix_user -d auralytix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Qdrant Vector Database (for RAG Knowledge Assistant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: auralytix-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. Unified FastAPI Backend (SHAP + RAG + RL + DB + AWS Connectors)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auralytix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://auralytix_user:auralytix_secure_password@postgres:5432/auralytix_db}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION_NAME: auralytix_knowledge
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-auralytix-cloud-artifacts}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8000:8000"

  # 4. React SPA Frontend + Nginx Reverse Proxy (Port 80/443 on EC2)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auralytix-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  qdrant_data:
