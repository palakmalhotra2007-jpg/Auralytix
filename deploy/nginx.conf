# HTTP Server (Port 80) - Direct instant access without certificate warnings
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/auralytix;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(health|cloud|api|shap|policy|rag) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }
}

# HTTPS Server (Port 443) - Full TLS encryption
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/13.239.41.80.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.239.41.80.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/auralytix;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(health|cloud|api|shap|policy|rag) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
